name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` builds first via the pretest hook. The end-to-end tests spawn the compiled
      # dist/index.js as a real subprocess, so running them against a fresh checkout without
      # building fails with a misleading "Connection closed".
      - run: npm test
      # The CLI is the product. A build that compiles but does not run is a broken release —
      # exactly the failure mode that once shipped a binary producing no output at all.
      - run: node dist/index.js --version

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test]
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11.x. Node 22 ships npm 10.9.x, which predates OIDC support.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Trusted publishing needs npm >= 11.5.1. Pinned explicitly rather than trusting whatever
      # the runner image happens to bundle, because the failure mode is an auth error that says
      # nothing about versions.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Runs BEFORE the publish. npm publishes are irreversible, so every check that can fail the
      # release has to fail while failing is still free.
      - name: Guard against server.json drifting from package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_ENTRY="$(node -p "require('./server.json').packages[0].version")"
          MCP_NAME="$(node -p "require('./package.json').mcpName")"
          SERVER_NAME="$(node -p "require('./server.json').name")"
          fail=0
          [ "$TAG" = "$PKG_VERSION" ] || { echo "tag v$TAG != package.json $PKG_VERSION" >&2; fail=1; }
          [ "$SERVER_VERSION" = "$PKG_VERSION" ] || { echo "server.json version $SERVER_VERSION != package.json $PKG_VERSION" >&2; fail=1; }
          [ "$PKG_ENTRY" = "$PKG_VERSION" ] || { echo "server.json packages[0].version $PKG_ENTRY != package.json $PKG_VERSION" >&2; fail=1; }
          [ "$MCP_NAME" = "$SERVER_NAME" ] || { echo "package.json mcpName $MCP_NAME != server.json name $SERVER_NAME" >&2; fail=1; }
          exit $fail

      # No NODE_AUTH_TOKEN: authentication comes from the OIDC trusted publisher configured on
      # npmjs.com for this package (sp3ak/safenode-mcp-gateway, ci.yml, environment "npm").
      # The `environment: npm` above is part of that claim — remove it and OIDC stops matching.
      - run: npm publish --provenance --access public

      # MCP Registry publishing lives in publish-mcp.yml, not here. Coupling them meant a registry
      # failure after a successful npm publish could never be retried, because npm rejects a
      # duplicate version. The registry job also must not run under an environment: that changes
      # the OIDC subject claim, and the registry matches on the ref-based one.
